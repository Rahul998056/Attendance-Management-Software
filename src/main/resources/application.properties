spring.application.name=attendance-management
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/attendance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:attendance_user}
spring.datasource.password=${DB_PASSWORD:StrongPass123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Helpful JSON errors in development (Postman-friendly)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=on_param

# JWT settings
jwt.secret=ChangeThisSecretToAStrongValueChangeThisToLongRandomString
jwt.expiration-ms=3600000

# Default seeded admin (only created if missing)
admin.seed.username=superadmin
admin.seed.email=superadmin@company.com
admin.seed.password=Admin@123
